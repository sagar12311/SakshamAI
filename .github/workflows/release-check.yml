name: Public beta checks

on:
  pull_request:
  push:
    branches: [main, public-beta]

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release hygiene
        run: bash tools/release-check.sh

  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway test dependencies
        run: python -m pip install -r gateway/requirements-dev.txt
      - name: Test gateway safety controls
        run: PYTHONPATH=gateway pytest gateway/tests -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build public beta frontend
        working-directory: frontend
        run: npm run build
      - name: Test public beta frontend
        working-directory: frontend
        run: npm test -- --run
