[project]
name = "saksham-backend"
version = "0.1.0"
description = "Saksham AI - Cognitive Intelligence System with Voice Control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    
    # LLM & AI
    "openai>=1.12.0",
    "tiktoken>=0.5.0",
    "faster-whisper>=1.1.0",
    "sentence-transformers>=3.0.0",

    # Vector Database
    "chromadb>=0.4.22",
    
    # Database
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    
    # Voice Processing
    "openai-whisper>=20231117",
    "numpy>=2.0.0",
    "noisereduce>=3.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pyaudio>=0.2.14",
    "edge-tts>=7.0.0",
    "piper-tts>=1.3.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",

    # Mac Integration
    "pyobjc-framework-Cocoa>=10.1",
    "pyobjc-framework-ApplicationServices>=10.1",
    
    # Utilities
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.1.0",
    "ruff>=0.1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "api", "core", "mac", "memory", "config.py", "main.py"]
